<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Cypher Security{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
      /* --- CYPHER THEME (Global) --- */
      :root {
          --cypher-bg-dark: #0a0a0a;
          --cypher-card-bg: #141414;
          --cypher-neon: #00f2ff; /* Cyan Neon */
          --cypher-text: #e0e0e0;
          --cypher-text-muted: #8a8a8a;
      }

      body {
        background-color: var(--cypher-bg-dark);
        color: var(--cypher-text);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      .auth-container {
        max-width: 450px;
        width: 100%;
      }

      /* Card Styling */
      .card {
        background-color: var(--cypher-card-bg);
        border: 1px solid #333;
        box-shadow: 0 0 15px rgba(0, 242, 255, 0.1); 
        color: var(--cypher-text);
      }

      .card-title {
          color: var(--cypher-neon);
          text-transform: uppercase;
          letter-spacing: 2px;
          font-weight: bold;
      }
      
      .text-muted {
          color: var(--cypher-text-muted) !important;
      }

      /* --- INPUT FIELDS (Targeting all inputs for consistency) --- */
      .form-control, 
      input[type="text"], 
      input[type="password"], 
      input[type="email"] {
          background-color: #222 !important;
          border: 1px solid #444;
          color: var(--cypher-text) !important;
          border-radius: 5px;
          padding: 10px 15px;
      }
      
      .form-control:focus,
      input[type="text"]:focus, 
      input[type="password"]:focus, 
      input[type="email"]:focus {
          background-color: #2a2a2a !important;
          border-color: var(--cypher-neon);
          color: var(--cypher-text);
          box-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
          outline: none;
      }
      
      /* Labels */
      .form-label, label {
          color: var(--cypher-text);
          font-weight: 500;
          margin-bottom: 8px;
      }

      /* Input Group Icons */
      .input-group-text {
          background-color: #333;
          border: 1px solid #444;
          color: var(--cypher-text);
          border-left: none;
      }

      /* --- BUTTONS --- */
      /* Neon Button */
      .btn-primary {
          background-color: transparent;
          border: 2px solid var(--cypher-neon);
          color: var(--cypher-neon);
          font-weight: bold;
          text-transform: uppercase;
          letter-spacing: 1px;
          transition: all 0.3s ease;
          width: 100%;
          padding: 10px;
      }

      .btn-primary:hover {
          background-color: var(--cypher-neon);
          color: #000;
          box-shadow: 0 0 20px var(--cypher-neon);
          border-color: var(--cypher-neon);
      }

      /* Links */
      a {
          color: var(--cypher-neon);
          text-decoration: none;
          transition: color 0.3s;
      }
      a:hover {
          color: #fff;
          text-shadow: 0 0 5px var(--cypher-neon);
      }
      
      /* Alerts */
      .alert-danger {
          background-color: rgba(220, 53, 69, 0.1);
          border: 1px solid #dc3545;
          color: #ff6b6b;
      }
      
      .alert-success {
          background-color: rgba(0, 242, 255, 0.1);
          border: 1px solid var(--cypher-neon);
          color: var(--cypher-neon);
      }
      
      /* Help Text (password rules etc) */
      .helptext, .form-text {
          color: #666;
          font-size: 0.85em;
      }
    </style>
  </head>
  <body class="d-flex align-items-center justify-content-center" style="min-height: 100vh">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 auth-container my-5">
            <div class="text-center mb-4">
                 <h1 style="color: var(--cypher-neon); letter-spacing: 4px; text-shadow: 0 0 15px rgba(0,242,255,0.6);">CYPHER</h1>
            </div>
          <div class="card shadow-lg rounded-4">
            <div class="card-body p-4 p-sm-5">
              {% block content %}{% endblock %}
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
