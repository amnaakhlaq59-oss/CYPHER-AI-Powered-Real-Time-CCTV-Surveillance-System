<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cypher Dashboard{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- MINIMAL CUSTOM NEON ACCENTS --- */
        :root {
            --cypher-neon: #00f2ff;
            --cypher-danger: #ff2a6d;
        }

        /* Make background darker than standard Bootstrap gray */
        body { background-color: #050505; }
        
        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            top: 0; left: 0;
            background-color: #0a0a0a; /* Darker than bg-dark */
            border-right: 1px solid #333;
            z-index: 1000;
        }

        .main-content {
            margin-left: 260px;
            padding: 30px;
        }

        /* Brand Text Glow */
        .brand-text {
            color: var(--cypher-neon);
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        /* Nav Links */
        .nav-link { 
            color: #aaa; 
            padding: 12px 20px;
            border-left: 3px solid transparent;
        }
        .nav-link:hover, .nav-link.active {
            color: white;
            background: rgba(0, 242, 255, 0.05);
            border-left-color: var(--cypher-neon);
        }
        .nav-link i { width: 25px; text-align: center; }

        /* Custom Utility classes for Neon Borders */
        .border-neon { border-color: var(--cypher-neon) !important; }
        .border-danger-neon { border-color: var(--cypher-danger) !important; }
        .text-neon { color: var(--cypher-neon) !important; }
        
        /* Glass Card Effect on top of Bootstrap Card */
        .card {
            background-color: rgba(20, 20, 20, 0.6); /* Semi-transparent */
            backdrop-filter: blur(10px);
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <nav class="sidebar d-flex flex-column p-3">
        <div class="mb-4 text-center pb-3 border-bottom border-secondary">
            <h2 class="brand-text m-0">CYPHER</h2>
        </div>

        <ul class="nav flex-column mb-auto">
            <li class="nav-item">
                <a href="{% url 'dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                    <i class="fas fa-th-large me-2"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a href="{% url 'cameras' %}" class="nav-link {% if request.resolver_match.url_name == 'cameras' %}active{% endif %}">
                    <i class="fas fa-video me-2"></i> Live Feeds
                </a>
            </li>
            <li class="nav-item">
                <a href="{% url 'alerts' %}" class="nav-link {% if request.resolver_match.url_name == 'alerts' %}active{% endif %}">
                    <i class="fas fa-bell me-2"></i> Alerts
                </a>
            </li>
            
            <!-- SECURITY FIX: Only show Users link to Superusers -->
            {% if user.is_superuser %}
            <li class="nav-item">
                <a href="{% url 'users' %}" class="nav-link {% if request.resolver_match.url_name == 'users' %}active{% endif %}">
                    <i class="fas fa-users me-2"></i> Users
                </a>
            </li>
            {% endif %}

            <li class="nav-item">
                <a href="{% url 'settings' %}" class="nav-link {% if request.resolver_match.url_name == 'settings' %}active{% endif %}">
                    <i class="fas fa-cog me-2"></i> Settings
                </a>
            </li>
        </ul>

        <div class="border-top border-secondary pt-3">
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button class="btn btn-outline-danger w-100 border-0 text-start">
                    <i class="fas fa-sign-out-alt me-2"></i> Logout
                </button>
            </form>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBiffbVteD5FgSZUbZGyYFZDgUVHzVtx6c",
            authDomain: "cypher-19953.firebaseapp.com",
            databaseURL: "https://cypher-19953-default-rtdb.firebaseio.com",
            projectId: "cypher-19953",
            storageBucket: "cypher-19953.firebasestorage.app",
            messagingSenderId: "956319635524",
            appId: "1:956319635524:web:e7c68bec160830c1e4c411",
            measurementId: "G-GW0GPF5FJB"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Make the database available to other pages (like alerts.html)
        window.firebaseDb = db;
        
        console.log("🔥 Cypher Firebase Connected Successfully!");
    </script>
</body>
</html>
